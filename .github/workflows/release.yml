name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Export Windows build
        run: |
          mkdir -p builds/windows
          touch builds/.gdignore
          godot --headless --path . --import
          godot --headless --path . --export-release "Windows" builds/windows/BeautyForest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BeautyForest-windows
          path: builds/windows/BeautyForest.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Export Linux build
        run: |
          mkdir -p builds/linux
          touch builds/.gdignore
          godot --headless --path . --import
          godot --headless --path . --export-release "Linux" builds/linux/BeautyForest.x86_64
      - name: Smoke the exported binary
        run: |
          chmod +x builds/linux/BeautyForest.x86_64
          builds/linux/BeautyForest.x86_64 --headless --quit-after 300 | tee boot.log
          grep -q "BEAUTY_FOREST_BOOT_OK" boot.log
      - uses: actions/upload-artifact@v4
        with:
          name: BeautyForest-linux
          path: builds/linux/BeautyForest.x86_64

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No setup-android action: GitHub's ubuntu runners ship a preinstalled
      # SDK (ANDROID_HOME points at it) with the build-tools and platform
      # packages gradle needs, and the action itself has been the flaky leg
      # of this job — it died inside its own install twice in a row, before
      # Godot was even downloaded.
      - name: Install Godot 4.7.2 and templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m 755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Generate a release keystore
        run: |
          keytool -genkeypair -v -keystore beauty.keystore -alias beautyforest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Beauty Forest, O=mlibre, C=US"
        env:
          KEYSTORE_PASSWORD: beauty-forest-cozy-walk
      # The keystore reaches Godot through its own environment variables, and
      # the toolchain through JAVA_HOME / ANDROID_HOME, which Godot reads
      # directly. The editor-settings file and .godot/export_credentials.cfg
      # routes both failed in the field: a bare key fragment is not a parseable
      # .tres, so the settings never loaded, and the credentials keys are
      # keystore/release_password / _user / keystore/release — _pass was a name
      # Godot never read, so the trio always looked half-configured.
      - name: Export Android build
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/beauty.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: beautyforest
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: beauty-forest-cozy-walk
        run: |
          mkdir -p builds/android
          touch builds/.gdignore
          godot --headless --path . --import
          godot --headless --path . --export-release "Android" builds/android/BeautyForest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BeautyForest-android
          path: builds/android/BeautyForest.apk

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j BeautyForest-Windows.zip BeautyForest-windows/BeautyForest.exe
          zip -j BeautyForest-Linux.zip BeautyForest-linux/BeautyForest.x86_64
          cp BeautyForest-android/BeautyForest.apk BeautyForest-Android.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" BeautyForest-Windows.zip BeautyForest-Linux.zip BeautyForest-Android.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              BeautyForest-Windows.zip BeautyForest-Linux.zip BeautyForest-Android.apk \
              --title "Beauty Forest $GITHUB_REF_NAME" \
              --notes "A cozy walk — no hurry, no losing. Unzip, run, wander. The Android APK is self-signed: allow installs from this source when your phone asks."
          fi
